<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Curve Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            max-width: 1400px;
            width: 100%;
            overflow: hidden;
        }

        .canvas-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
        }

        canvas {
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background: white;
            max-width: 100%;
        }

        .controls-section {
            width: 350px;
            padding: 40px;
            background: white;
            overflow-y: auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #2980b9;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            border: none;
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .value-display {
            display: inline-block;
            margin-left: 10px;
            color: #7f8c8d;
            font-size: 13px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(149, 165, 166, 0.3);
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .controls-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-section">
            <canvas id="asteroidCanvas" width="600" height="600"></canvas>
        </div>

        <div class="controls-section">
            <h1>Asteroid Curve Generator</h1>
            <p class="subtitle">Create mathematically accurate asteroid curves</p>

            <div class="control-group">
                <label>Curve Type</label>
                <select id="curveType">
                    <option value="astroid">Astroid (4 cusps)</option>
                    <option value="asteroid">Realistic Asteroid</option>
                    <option value="hypocycloid">Hypocycloid (Custom)</option>
                </select>
            </div>

            <div class="control-group">
                <label>
                    Sharpness (Cusps/Points)
                    <span class="value-display" id="sharpnessValue">4</span>
                </label>
                <input type="range" id="sharpness" min="3" max="20" value="4" step="1">
            </div>

            <div class="control-group">
                <label>
                    Size
                    <span class="value-display" id="sizeValue">200</span>
                </label>
                <input type="range" id="size" min="50" max="280" value="200" step="10">
            </div>

            <div class="control-group">
                <label>
                    Randomness
                    <span class="value-display" id="randomnessValue">0.0</span>
                </label>
                <input type="range" id="randomness" min="0" max="100" value="0" step="5">
            </div>

            <div class="control-group">
                <label>
                    Stroke Width
                    <span class="value-display" id="strokeWidthValue">2</span>
                </label>
                <input type="range" id="strokeWidth" min="1" max="20" value="2" step="1">
            </div>

            <div class="control-group">
                <label>Fill Color</label>
                <input type="color" id="fillColor" value="#00ff00">
            </div>

            <div class="control-group">
                <label>Stroke Color</label>
                <input type="color" id="strokeColor" value="#00b300">
            </div>

            <div class="control-group">
                <label>Display Mode</label>
                <select id="displayMode">
                    <option value="filled">Filled</option>
                    <option value="outline">Outline Only</option>
                    <option value="both">Both</option>
                </select>
            </div>

            <div class="control-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="showCenter">
                    <label for="showCenter" style="margin: 0;">Show Center Point</label>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-secondary" id="randomizeBtn">Randomize</button>
                <button class="btn-primary" id="regenerateBtn">Regenerate</button>
            </div>

            <div class="button-group">
                <button class="btn-success" id="downloadBtn">Download SVG</button>
            </div>
        </div>
    </div>

    <script>
        class AsteroidGenerator {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.centerX = canvas.width / 2;
                this.centerY = canvas.height / 2;
                this.config = {
                    curveType: 'astroid',
                    sharpness: 4,
                    size: 200,
                    randomness: 0,
                    fillColor: '#00ff00',   // lime-like fill
                    strokeColor: '#00b300', // darker lime stroke
                    strokeWidth: 2,
                    displayMode: 'filled',
                    showCenter: false
                };
                this.points = [];
            }

            // Generate classic astroid curve (x = a*cos³(t), y = a*sin³(t))
            generateAstroid() {
                const points = [];
                const steps = 360;
                const a = this.config.size;

                for (let i = 0; i <= steps; i++) {
                    const t = (i / steps) * 2 * Math.PI;
                    const cosT = Math.cos(t);
                    const sinT = Math.sin(t);

                    const x = a * Math.pow(Math.abs(cosT), 3) * Math.sign(cosT);
                    const y = a * Math.pow(Math.abs(sinT), 3) * Math.sign(sinT);

                    points.push({ x, y });
                }

                return points;
            }

            // Generate hypocycloid with custom number of cusps
            generateHypocycloid() {
                const points = [];
                const steps = 720;
                const R = this.config.size; // Fixed circle radius
                const r = R / this.config.sharpness; // Rolling circle radius
                const d = r; // Distance from center of rolling circle

                for (let i = 0; i <= steps; i++) {
                    const t = (i / steps) * 2 * Math.PI * this.config.sharpness;

                    const x = (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t);
                    const y = (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t);

                    points.push({ x, y });
                }

                return points;
            }

            // Generate realistic asteroid shape with randomness
            generateRealisticAsteroid() {
                const points = [];
                const numPoints = Math.max(20, this.config.sharpness * 5);
                const baseRadius = this.config.size;
                const randomFactor = this.config.randomness / 100;

                // Generate random angles and radii for more realistic shape
                const anglePoints = [];
                for (let i = 0; i < numPoints; i++) {
                    const angle = (i / numPoints) * 2 * Math.PI;
                    const radiusVariation = 1 + (Math.random() - 0.5) * randomFactor;
                    const radius = baseRadius * radiusVariation;

                    anglePoints.push({ angle, radius });
                }

                // Create smooth curve through points using interpolation
                const smoothSteps = 360;
                for (let i = 0; i <= smoothSteps; i++) {
                    const t = (i / smoothSteps) * 2 * Math.PI;

                    // Find neighboring points for interpolation
                    const idx = Math.floor((i / smoothSteps) * numPoints);
                    const nextIdx = (idx + 1) % numPoints;

                    const p1 = anglePoints[idx];
                    const p2 = anglePoints[nextIdx];

                    const localT = ((i / smoothSteps) * numPoints) % 1;
                    const radius = p1.radius + (p2.radius - p1.radius) * localT;

                    const x = radius * Math.cos(t);
                    const y = radius * Math.sin(t);

                    points.push({ x, y });
                }

                return points;
            }

            generate() {
                switch (this.config.curveType) {
                    case 'astroid':
                        this.points = this.generateAstroid();
                        break;
                    case 'hypocycloid':
                        this.points = this.generateHypocycloid();
                        break;
                    case 'asteroid':
                        this.points = this.generateRealisticAsteroid();
                        break;
                }

                // Apply additional randomness if set
                if (this.config.randomness > 0 && this.config.curveType !== 'asteroid') {
                    const randomFactor = this.config.randomness / 500;
                    this.points = this.points.map(p => ({
                        x: p.x + (Math.random() - 0.5) * this.config.size * randomFactor,
                        y: p.y + (Math.random() - 0.5) * this.config.size * randomFactor
                    }));
                }
            }

            draw() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.points.length === 0) return;

                this.ctx.save();
                this.ctx.translate(this.centerX, this.centerY);

                // Begin path
                this.ctx.beginPath();
                this.ctx.moveTo(this.points[0].x, this.points[0].y);

                for (let i = 1; i < this.points.length; i++) {
                    this.ctx.lineTo(this.points[i].x, this.points[i].y);
                }

                this.ctx.closePath();

                // Fill
                if (this.config.displayMode === 'filled' || this.config.displayMode === 'both') {
                    this.ctx.fillStyle = this.config.fillColor;
                    this.ctx.fill();
                }

                // Stroke
                if (this.config.displayMode === 'outline' || this.config.displayMode === 'both') {
                    this.ctx.strokeStyle = this.config.strokeColor;
                    this.ctx.lineWidth = this.config.strokeWidth;
                    this.ctx.stroke();
                }

                // Show center point
                if (this.config.showCenter) {
                    this.ctx.fillStyle = '#333';
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 5, 0, 2 * Math.PI);
                    this.ctx.fill();
                }

                this.ctx.restore();
            }

            generateSVG() {
                if (this.points.length === 0) return '';

                const width = this.canvas.width;
                const height = this.canvas.height;

                let pathData = `M ${this.centerX + this.points[0].x} ${this.centerY + this.points[0].y}`;

                for (let i = 1; i < this.points.length; i++) {
                    pathData += ` L ${this.centerX + this.points[i].x} ${this.centerY + this.points[i].y}`;
                }

                pathData += ' Z';

                const fillAttr = (this.config.displayMode === 'filled' || this.config.displayMode === 'both')
                    ? `fill="${this.config.fillColor}"`
                    : 'fill="none"';

                const strokeAttr = (this.config.displayMode === 'outline' || this.config.displayMode === 'both')
                    ? `stroke="${this.config.strokeColor}" stroke-width="${this.config.strokeWidth}"`
                    : '';

                const centerPoint = this.config.showCenter
                    ? `<circle cx="${this.centerX}" cy="${this.centerY}" r="5" fill="#333"/>`
                    : '';

                return `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
    <path d="${pathData}" ${fillAttr} ${strokeAttr}/>
    ${centerPoint}
</svg>`;
            }

            update() {
                this.generate();
                this.draw();
            }

            updateConfig(key, value) {
                this.config[key] = value;
                this.update();
            }
        }

        // Initialize
        const canvas = document.getElementById('asteroidCanvas');
        const generator = new AsteroidGenerator(canvas);

        // Control bindings
        const controls = {
            curveType: document.getElementById('curveType'),
            sharpness: document.getElementById('sharpness'),
            size: document.getElementById('size'),
            randomness: document.getElementById('randomness'),
            fillColor: document.getElementById('fillColor'),
            strokeColor: document.getElementById('strokeColor'),
            strokeWidth: document.getElementById('strokeWidth'),
            displayMode: document.getElementById('displayMode'),
            showCenter: document.getElementById('showCenter')
        };

        // Value displays
        const displays = {
            sharpness: document.getElementById('sharpnessValue'),
            size: document.getElementById('sizeValue'),
            randomness: document.getElementById('randomnessValue'),
            strokeWidth: document.getElementById('strokeWidthValue')
        };

        // Update handlers
        controls.curveType.addEventListener('change', (e) => {
            generator.updateConfig('curveType', e.target.value);
        });

        controls.sharpness.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            displays.sharpness.textContent = value;
            generator.updateConfig('sharpness', value);
        });

        controls.size.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            displays.size.textContent = value;
            generator.updateConfig('size', value);
        });

        controls.randomness.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            displays.randomness.textContent = (value / 100).toFixed(2);
            generator.updateConfig('randomness', value);
        });

        controls.strokeWidth.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            displays.strokeWidth.textContent = value;
            generator.updateConfig('strokeWidth', value);
        });

        controls.fillColor.addEventListener('input', (e) => {
            generator.updateConfig('fillColor', e.target.value);
        });

        controls.strokeColor.addEventListener('input', (e) => {
            generator.updateConfig('strokeColor', e.target.value);
        });

        controls.displayMode.addEventListener('change', (e) => {
            generator.updateConfig('displayMode', e.target.value);
        });

        controls.showCenter.addEventListener('change', (e) => {
            generator.updateConfig('showCenter', e.target.checked);
        });

        // Buttons
        document.getElementById('regenerateBtn').addEventListener('click', () => {
            generator.update();
        });

        document.getElementById('randomizeBtn').addEventListener('click', () => {
            controls.sharpness.value = Math.floor(Math.random() * 15) + 3;
            controls.size.value = Math.floor(Math.random() * 150) + 100;
            controls.randomness.value = Math.floor(Math.random() * 60);
            controls.strokeWidth.value = Math.floor(Math.random() * 10) + 1;
            controls.fillColor.value = '#' + Math.floor(Math.random()*16777215).toString(16);
            controls.strokeColor.value = '#' + Math.floor(Math.random()*16777215).toString(16);

            displays.sharpness.textContent = controls.sharpness.value;
            displays.size.textContent = controls.size.value;
            displays.randomness.textContent = (controls.randomness.value / 100).toFixed(2);
            displays.strokeWidth.textContent = controls.strokeWidth.value;

            generator.updateConfig('sharpness', parseInt(controls.sharpness.value));
            generator.updateConfig('size', parseInt(controls.size.value));
            generator.updateConfig('randomness', parseInt(controls.randomness.value));
            generator.updateConfig('strokeWidth', parseInt(controls.strokeWidth.value));
            generator.updateConfig('fillColor', controls.fillColor.value);
            generator.updateConfig('strokeColor', controls.strokeColor.value);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const svg = generator.generateSVG();
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `asteroid-curve-${Date.now()}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Initial generation
        generator.update();
    </script>
</body>
</html>
